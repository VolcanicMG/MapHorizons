modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/VolcanicMG/MapHorizons/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="VolcanicMG"
displayURL="https://github.com/VolcanicMG/MapHorizons"
description='''
Fills Xaero's World Map and Minimap with Distant Horizons terrain and syncs your team's exploration, so you see land your teammates found without walking there. FTB Teams scoping, Nether support, Xaero-matched colours.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="xaeroworldmap"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="distanthorizons"
    type="optional"
    versionRange="[3.3,3.4)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="ftbteams"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
